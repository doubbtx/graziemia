services:
  - type: web
    name: graziemia-api-doubbtx
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ALLOWED_ORIGINS
        value: https://graziemia.vercel.app
